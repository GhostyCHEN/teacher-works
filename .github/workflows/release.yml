# 自动构建发布包并创建 GitHub Release
#
# 触发: 推送 v* tag (例如 v1.0.2) 或 Actions 页面手动 Run workflow
# 流程:
#   1. 跑 build.sh 产出 release/teacher-ops-<version>-<timestamp>.tar.gz (+ .zip)
#   2. 重命名为稳定的 teacher-ops-latest.tar.gz (让 README 里的
#      releases/latest/download/teacher-ops-latest.tar.gz 永久可用)
#   3. 创建 GitHub Release 并上传 tar.gz / zip / 校验和为资产
#
# 与 docker-publish.yml 共存: 推 v* tag 时两者并行触发,
#   - docker-publish.yml 构建多架构 GHCR 镜像
#   - release.yml 构建并发布 GitHub Release 二进制包
# 二者无依赖, 任何一方失败不影响另一方
name: 发版（GitHub Release）

on:
  push:
    tags: ['v*']
  workflow_dispatch:    # 支持手动触发(选任意 tag/分支)

# tag 推送是发版动作, 一次性, 不要 cancel-in-progress
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write       # 创建 release 需要写权限

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: 安装 zip（产出 Windows 包需要）
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: 跑 build.sh 产出 tarball
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 重命名为稳定的 'teacher-ops-latest' asset 名
        # README L100 的 wget 期望固定资产名
        # releases/latest/download/teacher-ops-latest.tar.gz
        # 永远指向最新 release 的同名资产
        run: |
          cd release
          cp teacher-ops-*.tar.gz teacher-ops-latest.tar.gz
          ls -la

      - name: 创建 GitHub Release 并上传资产
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/teacher-ops-latest.tar.gz
            release/*.zip
            release/*.sha256
            release/*.md5