version: '3.8'

services:
  teacher-ops:
    # 默认: 本地构建(源码部署)
    build:
      context: .
      dockerfile: Dockerfile
    # 可选: 从 GHCR 拉取镜像部署
    # 使用方法: 注释上面 build 段,取消下面 image 注释
    # image: ghcr.io/GhostyCHEN/teacher-works:latest
    container_name: teacher-ops
    restart: always          # 异常后自动重启
    ports:
      - "3000:3000"
    volumes:
      # 数据持久化 - 数据库和上传文件(代码已 baked in 镜像,不再 bind mount)
      - ./data:/app/data
      # 日志持久化
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/database.sqlite
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s